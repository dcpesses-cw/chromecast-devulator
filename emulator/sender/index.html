<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chromecast Sender</title>
		<link rel="stylesheet" href="/src/styles/global.css" />
		<link rel="stylesheet" href="/sender/styles.css" />
		<script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
	</head>
	<body>
		<section class="sender-page">
			<header>
				<div>
					<div id="cast-status-label">Connect to Local Receiver</div>
					<div id="cast-button"></div>
				</div>
				<div>
					<div>Send Load Request</div>
					<div id="load-button"></div>
				</div>
			</header>

			<section class="mini-controller">
				<h2 id="media-title">&nbsp;</h2>
				<h3 id="media-subtitle">&nbsp;</h3>
				<img id="media-thumb" src="/idle-icon.png" alt="thumb" />

				<div id="progress-bar" class="progress-bar"></div>

				<div class="controls">
					<div class="playback" id="playback-controls"></div>
					<div class="seek" id="seek-controls"></div>
					<div class="sound">
						<div id="mute-button"></div>
						<input type="range" id="volume-slider" min="0" max="100" value="50" />
					</div>
				</div>
			</section>

			<section class="default-requests">
				<h3>Choose Load Request Template:</h3>
				<div>
					<div>
						<label id="template-basic" class="active">
							<input type="radio" name="template" value="basic" checked />
							<div>Basic</div>
						</label>
						<label id="template-queue">
							<input type="radio" name="template" value="basic-queue" />
							<div>Basic Queue</div>
						</label>
						<span>or Load:</span>
						<label id="template-from-localstorage1">
							<input type="radio" name="template" value="1" />
							<div>Custom 1</div>
						</label>
						<label id="template-from-localstorage2">
							<input type="radio" name="template" value="2" />
							<div>Custom 2</div>
						</label>
						<label id="template-from-localstorage3">
							<input type="radio" name="template" value="3" />
							<div>Custom 3</div>
						</label>
					</div>
					<div>
						<span>Save to:</span>
						<label id="save-to-localstorage1">
							<div>1</div>
						</label>
						<label id="save-to-localstorage2">
							<div>2</div>
						</label>
						<label id="save-to-localstorage3">
							<div>3</div>
						</label>
					</div>
				</div>
			</section>

			<div id="load-request-input"></div>
		</section>

		<script type="module" src="/sender/main.js"></script>
	</body>
</html>
